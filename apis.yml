name: INGU
description: INGU is a pipeline integrity technology company delivering inline inspection
  for oil & gas and water/wastewater pipelines through its Pipers multi-sensor free-floating
  inspection system paired with AI analytics and GIS-based pipeline viewer software.
  The platform performs leak detection, deposit and wall-condition assessment, and
  detection of gas pockets, magnetic features, bends, and hot taps across pipelines
  of any diameter or material. INGU has inspected over 900 pipelines for operators
  including Chevron, Shell, TotalEnergies, SUEZ, and Vale. Added to the API Evangelist
  network as a portfolio company of 500 Global; the company publishes no public API
  or developer surface at this time.
